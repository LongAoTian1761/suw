name: 同步同学提交的答案

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-submissions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 把 Issues 同步为 data/answers.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-submissions.mjs

      - name: 重新生成静态页面
        run: node scripts/build.mjs

      - name: 提交改动
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有变化，跳过提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/answers.json
          git add --all -- '*.html' .nojekyll
          git commit -m "chore: sync student submissions from issues"
          git push
